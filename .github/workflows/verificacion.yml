# ============================================================
#  VERIFICACIÓN ANTES DE DESPLEGAR  (AUD-013)
#
#  Hasta ahora correr las pruebas dependía de que alguien se acordara.
#  El bug que dejó al mozo sin poder vender una categoría entera pasó
#  el build, pasó el lint y llegó al bar: lo que faltaba no era una
#  herramienta más, era que las que hay corran solas en cada cambio.
#
#  Los emuladores necesitan Java, así que se instala acá y no en la
#  máquina de nadie.
# ============================================================
name: Verificación

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # El emulador de Firestore corre sobre la JVM, y firebase-tools 15
      # exige JDK 21 o superior: con 17 ni arranca. Tiene que coincidir con
      # el de la maquina donde se desarrolla, o la CI falla por algo que
      # localmente anda.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar dependencias de las Functions
        run: npm ci --prefix functions

      # Guardar el jar del emulador entre corridas: bajarlo cada vez son
      # varios minutos de nada.
      - name: Cache de los emuladores
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: emuladores-${{ runner.os }}-

      - name: Lint
        run: npm run lint

      - name: Pruebas de unidad
        run: npm run test:unidad

      - name: Pruebas de reglas
        run: npm run test:reglas

      # El emulador de Functions a veces no llega a levantar y todas las
      # llamadas se quedan sin respuesta: es un arranque flaky conocido,
      # no una falla del código. Se reintenta una vez antes de dar rojo,
      # porque una CI que falla al azar deja de mirarse.
      - name: Pruebas de Functions
        run: npm run test:funciones || npm run test:funciones

      # El navegador pesa; se cachea por version de Playwright.
      - name: Cache del navegador
        uses: actions/cache@v4
        id: cache-navegador
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Los recorridos: abren la app de verdad contra los emuladores.
      - name: Pruebas de recorrido
        run: npm run test:e2e

      - name: Guardar el informe si algo fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

      - name: Build
        run: npm run build
